name: Trigger deployed UNT news ingestion

permissions: {}

on:
  schedule:
    # 06:00 Asia/Almaty = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allows manual execution from GitHub UI

concurrency:
  group: deployed-ntc-news-ingestion
  cancel-in-progress: false

jobs:
  trigger-deployed-ingestion:
    name: Trigger production UNT ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Invoke authenticated deployment endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            --request POST "${INGESTION_ENDPOINT}" \
            --header "X-UNT-Ingestion-Key: ${NEWS_INGESTION_SECRET}"
        env:
          INGESTION_ENDPOINT: ${{ secrets.INGESTION_ENDPOINT }}
          NEWS_INGESTION_SECRET: ${{ secrets.NEWS_INGESTION_SECRET }}
