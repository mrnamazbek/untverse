name: UNTverse Daily News & Ingestion Scheduler

on:
  schedule:
    # 06:00 Asia/Almaty = 01:00 UTC
    # 18:00 Asia/Almaty = 13:00 UTC
    - cron: '0 1,13 * * *'
  workflow_dispatch:  # Allows manual execution from GitHub UI

jobs:
  run-daily-ingestion:
    name: Run UNT News & Knowledge Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Ingestion
        working-directory: ./backend
        run: |
          PYTHONPATH=. python app/infrastructure/scheduler/daily_ingest.py
        env:
          ENVIRONMENT: production
          DATABASE_URL: sqlite+aiosqlite:///./unt_informatics.db
