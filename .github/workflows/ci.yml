# ==============================================================================
# UNTverse — CI/CD Pipeline
# Backend: Python 3.12, Pytest, Ruff linting
# Frontend: Node.js 22, TypeScript check, ESLint, Unit tests, Next.js build
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Backend: Lint + Test + Coverage
  # ──────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend: Ruff Lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        working-directory: ./backend
        run: ruff check .

      - name: Run Ruff formatter check
        working-directory: ./backend
        run: ruff format --check .

  backend-test:
    name: "Backend: Tests & Coverage"
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unt_test
          POSTGRES_USER: unt_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unt_user -d unt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://unt_user:test_password@localhost:5432/unt_test
        run: alembic upgrade head

      - name: Run Pytest with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://unt_user:test_password@localhost:5432/unt_test
          ENVIRONMENT: testing
          JWT_SECRET: ci_test_jwt_secret_do_not_use_in_production_1234567890
        run: |
          PYTHONPATH=. pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript + Lint + Unit Tests + Build
  # ──────────────────────────────────────────────────────────────────────────────
  frontend-check:
    name: "Frontend: Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

  frontend-test:
    name: "Frontend: Unit Tests"
    runs-on: ubuntu-latest
    needs: frontend-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit

  frontend-build:
    name: "Frontend: Production Build"
    runs-on: ubuntu-latest
    needs: [frontend-check, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js production build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://untverse-backend.up.railway.app/api/v1
