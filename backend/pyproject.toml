[project]
name = "unt-informatics-backend"
version = "1.0.0"
description = "UNT Informatics Learning Platform Backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
]
ignore = [
    "E501",
    "B008",
    "E712",  # SQLAlchemy boolean expressions require `== True` / `== False`
    "F841",  # Local unused variables in test fixtures
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/models/*" = ["F821"]
"alembic/env.py" = ["F403"]
